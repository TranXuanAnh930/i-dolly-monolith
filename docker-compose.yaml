# Runs the whole stack — backend (API, Celery worker, Postgres, Redis) and frontend — with one
# command from the repo root:
#
#   docker compose up --build
#
# Both apps come from their submodule's own compose file, so each is defined in one place. The
# backend's ${DATABASE_*} variables are read from i-dolly-backend/.env.
include:
  - path: i-dolly-backend/docker-compose.yaml
    env_file: i-dolly-backend/.env
  - i-dolly-frontend/docker-compose.yml
